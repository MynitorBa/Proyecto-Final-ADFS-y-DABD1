services:

  # Base de datos SQL Server 2022 Express con healthcheck para garantizar disponibilidad antes del backend
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${COMPOSE_PROJECT_NAME}-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost",
             "-U", "sa",
             "-P", "${DB_PASSWORD}",
             "-No",
             "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Contenedor efimero que aplica el esquema y los datos iniciales una sola vez.
  # 01_schema.sql  - Crea todas las tablas, indices, FKs, UDF, SP, trigger y vista.
  # 02_seed.sql    - Inserta catalogos maestros (idempotente).
  # 03_soft_delete_migration.sql - Agrega columnas Activo a Avion/MiembroTripulacion/Ruta
  #                  y renombra FKs si la BD existia antes de la v2. En instalaciones
  #                  frescas no hace nada (las columnas ya vienen en el schema).
  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: ${COMPOSE_PROJECT_NAME}-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql:/sql
    command: >
      /bin/bash -c "
        echo 'Creando schema y objetos...' &&
        /opt/mssql-tools/bin/sqlcmd -S db -U sa -P '${DB_PASSWORD}' -i /sql/01_schema.sql &&
        echo 'Cargando seed...' &&
        /opt/mssql-tools/bin/sqlcmd -S db -U sa -P '${DB_PASSWORD}' -i /sql/02_seed.sql &&
        echo 'Aplicando migracion v2 (soft-delete + renombre FKs)...' &&
        /opt/mssql-tools/bin/sqlcmd -S db -U sa -P '${DB_PASSWORD}' -i /sql/03_soft_delete_migration.sql &&
        if [ -f /sql/07_data.sql ]; then
          echo 'Cargando datos iniciales (07_data.sql)...' &&
          /opt/mssql-tools/bin/sqlcmd -S db -U sa -P '${DB_PASSWORD}' -i /sql/07_data.sql;
        else
          echo 'Sin datos iniciales (07_data.sql no encontrado, OK)';
        fi &&
        echo 'Base de datos lista'
      "
    restart: "no"

  # Backend ASP.NET Core expuesto en BACKEND_PORT.
  # Cors__Origins__0: frontend propio de esta instancia de aerolinea.
  # Cors__Origins__1: frontend de la agencia de viajes corriendo localmente,
  #   necesario para que el boton "Probar" del panel de proveedores pueda
  #   hacer peticiones cross-origin al backend de la aerolinea.
  # Cors__Origins__2: frontend del sistema hotelero corriendo localmente,
  #   necesario para que el panel del hotel pueda hacer peticiones
  #   cross-origin al backend de la aerolinea.
  # ServerURL: URL publica de este backend tal como lo ve la maquina anfitriona.
  #   Se envia al hotel durante el handshake para que lo registre en su BD y
  #   pueda identificar a esta aerolinea en llamadas futuras.
  #   Usa localhost:BACKEND_PORT porque el hotel corre fuera de Docker y desde
  #   la maquina anfitriona localhost:BACKEND_PORT si llega al contenedor
  #   gracias al mapeo de puertos de Docker.
  # HANDSHAKE_HOST_OVERRIDE: cuando el backend necesita llamar a una URL que
  #   contiene 'localhost' (ej: el hotel en localhost:7000), sustituye el host
  #   por 'host.docker.internal' para poder salir del contenedor hacia el host.
  # extra_hosts registra host.docker.internal -> gateway del host para que
  #   la resolucion DNS funcione en Linux sin configuracion adicional.
  backend:
    build:
      context: ../Aerolinea.API/Aerolinea.API
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=${DB_NAME};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      - Cors__Origins__0=http://localhost:${FRONTEND_PORT}
      - Cors__Origins__1=http://localhost:${AGENCY_PORT}
      - Cors__Origins__2=http://localhost:${HOTEL_PORT}
      - COOKIE_NAME=aerolinea_session_${COMPOSE_PROJECT_NAME}
      - ServerURL=http://localhost:${BACKEND_PORT}
      - HANDSHAKE_HOST_OVERRIDE=host.docker.internal
      - HOTEL_BACKEND_URL=http://host.docker.internal:${HOTEL_PORT}
      - EmailSettings__SenderPassword=${EMAIL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Frontend Svelte/Vite servido en FRONTEND_PORT apuntando al backend de esta instancia
  frontend:
    build:
      context: "../AirLine Broom"
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:${BACKEND_PORT}
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT}
      - VITE_HOTEL_URL=http://localhost:${HOTEL_PORT}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME}-db-data